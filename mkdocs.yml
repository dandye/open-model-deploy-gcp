site_name: Open Model & Gemma Deployment on Google Cloud
site_description: Automated deployment scripts, Terraform modules, Justfile recipes, and SOC Tier 1 Agentic Evaluation & GEPA / Harness^2 benchmarks for Google Gemma, Meta Llama, and Open-Weight Models on Vertex AI and Cloud Run
site_url: https://dandye.github.io/open-model-deploy-gcp/
repo_url: https://github.com/dandye/open-model-deploy-gcp
repo_name: dandye/open-model-deploy-gcp
edit_uri: edit/main/docs/

exclude_docs: |
  **/*.json
  **/*.jsonl
  **/*.tsv

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: "Theme: Tokyo Night (click to switch to GitHub Dark)"
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/github
        name: "Theme: GitHub Dark (click to switch to Dracula)"
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/bat
        name: "Theme: Dracula (click to switch to Light mode)"
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: "Theme: Light (click to switch to Tokyo Night)"
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
  - javascripts/katex.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

nav:
  - Home & Catalog:
    - Project Overview: index.md
    - Executive Project Summary: PROJECT_SUMMARY.md
    - Full Documentation Catalog: catalog.md
    - Model Registry Catalog: model_registry_catalog.md
    - Deployment Status Matrix: deployment_status.md
    - Cost & Hardware Sizing Analysis: cost_analysis.md
  - SOC Agent Evals & Benchmarks:
    - Overnight Sweep Leaderboard: soc_eval_results/OVERNIGHT_SWEEP_SUMMARY.md
    - Gemma vs. Gemini Comparative Evals: soc_model_comparative_evals.md
    - Llama & Partner Comparative Evals: llama_model_comparative_evals.md
    - Gen 5 Family-Instanced Suite Guide: evals_gen5.md
    - Gen 5 Reference Calibration: soc_eval_results/GEN5_CALIBRATION.md
    - Gemma SOC Evaluation Plan: gemma_soc_agent_evaluation_plan.md
    - Llama SOC Evaluation Plan: llama_soc_agent_evaluation_plan.md
    - Experiment Protocol: experiment_protocol.md
    - Thoughts on Discriminative Evals: thoughts_on_evals.md
    - SOC Eval Failure Analysis: soc_eval_failure_analysis.md
  - GEPA, Harness^2, & Runbooks:
    - Runbook Authoring Best Practices: RUNBOOK_AUTHORING_BEST_PRACTICES.md
    - DSPy RLM SOC Worker Evaluation: soc_eval_results/DSPY_RLM_WORKER_EVALUATION_ANALYSIS.md
    - DSPy Overnight Campaign Report: soc_eval_results/dspy_overnight/MORNING_REPORT.md
    - Harness^2 8-Hour Campaign Report: soc_eval_results/harness2_8h_campaign/HARNESS2_CAMPAIGN_REPORT.md
    - Gen 5 Cross-Model Transfer Scorecard: soc_eval_results/harness2_8h_campaign/gen5_transfer/GEN5_TRANSFER_SCORECARD.md
    - Track 2 Threat-Hunt Transfer Scorecard: soc_eval_results/harness2_8h_campaign/threat_hunt_multi_model/THREAT_HUNT_MULTI_MODEL_SCORECARD.md
    - Disciplined Hillclimber Analysis: soc_eval_results/DISCIPLINED_HILLCLIMBER_RUN_ANALYSIS.md
    - Hillclimber vs. RRSI Crosswalk: hillclimber_rrsi_crosswalk.md
    - Jev vs. Gemini Judge Evaluation: jev_vs_gemini_judge_evaluation.md
    - GEPA Runbook Evaluation Analysis: soc_eval_results/GEPA_RUNBOOK_EVALUATION_ANALYSIS.md
    - GEPA MCP Tool Description Analysis: soc_eval_results/GEPA_MCP_EVALUATION_ANALYSIS.md
    - GEPA Evidence Reconciliation: soc_eval_results/GEPA_EVIDENCE_RECONCILIATION.md
    - Agent Harness Literature: references_agent_harness_literature.md
  - Blog & Deep Dives:
